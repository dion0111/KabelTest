<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leitungstest – Demo</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Leitungstest">
<link rel="apple-touch-icon" id="touch" href="">
<style>
:root{--bg:#000;--panel:#16101a;--line:#3a2a42;--pink:#ff2d8f;--pink2:#ff7ac0;--text:#fff;--muted:#b7a9bf;--ok:#3ddc97;--bad:#ff5a6e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#fff;--panel:#fbeef5;--line:#f0c4dc;--text:#14081a;--muted:#6b5a73}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff;--panel:#fbeef5;--line:#f0c4dc;--text:#14081a;--muted:#6b5a73}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:420px;padding:16px 20px 32px;display:flex;flex-direction:column;gap:18px}
.demo{background:var(--pink);color:#000;font-weight:700;text-align:center;padding:8px 12px;border-radius:6px;font-size:13px}
h1{font-size:26px;margin:4px 0 0;line-height:1.15}
p.sub{margin:0;color:var(--muted);font-size:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:16px}
.gauge{position:relative;width:200px;height:200px}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.track{stroke:var(--line)}
.bar{stroke:var(--pink);stroke-linecap:round;transition:stroke .3s}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.pct{font-size:44px;font-weight:800}
.stat{font-size:13px;color:var(--muted);min-height:18px;padding:0 20px}
.result{width:100%;border-radius:14px;padding:16px;text-align:center;font-size:20px;font-weight:800;display:none;border:2px solid}
.result.bad{display:block;color:var(--bad);border-color:var(--bad)}
.result.ok{display:block;color:var(--ok);border-color:var(--ok)}
.result small{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:4px}
label{font-size:14px;color:var(--muted);width:100%}
select,button{font:inherit;width:100%;border-radius:12px;padding:14px;border:1px solid var(--line)}
select{background:var(--bg);color:var(--text);margin-top:6px}
button{background:var(--pink);color:#000;font-weight:800;border:0;cursor:pointer;font-size:17px}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--pink2);outline-offset:2px}
.foot{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.bar{transition:none}}
#cover{position:fixed;inset:0;z-index:10;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .5s;cursor:pointer}
#cover.hide{opacity:0;pointer-events:none}
#cover .ico{width:180px;height:180px;filter:drop-shadow(0 0 28px rgba(255,45,143,.55))}
#cover .hint{color:#b7a9bf;font-size:14px}
.needle{transform-origin:100px 88px;animation:sweep 1.8s cubic-bezier(.3,.1,.2,1) forwards}
@keyframes sweep{from{transform:rotate(-135deg)}to{transform:rotate(54deg)}}
@media (prefers-reduced-motion:reduce){.needle{animation:none;transform:rotate(54deg)}#cover{transition:none}}
</style>
</head>
<body>
<div id="cover" role="button" tabindex="0" aria-label="Demo starten"><div class="ico" id="coverIco"></div><div class="hint">Tippen zum Starten</div></div>
<main class="app">
  <div class="demo">DEMO</div>
  <div>
    <h1>Leitungsprüfung</h1>
    <p class="sub">Schulungsansicht zum Testen der Oberfläche</p>
  </div>
  <section class="card" aria-live="polite">
    <div class="gauge">
      <svg viewBox="0 0 200 200"><circle class="track" cx="100" cy="100" r="88" fill="none" stroke-width="12"/><circle id="bar" class="bar" cx="100" cy="100" r="88" fill="none" stroke-width="12" stroke-dasharray="553" stroke-dashoffset="553"/></svg>
      <div class="center"><div class="pct" id="pct">0%</div></div>
    </div>
    <div class="stat" id="stat">Bereit für die Demo</div>
    <div class="result" id="res"></div>
  </section>
  <label>Demo-Ergebnis (für die Schulung)
    <select id="scenario">
      <option value="bad">SVDSL nicht aktiv</option>
      <option value="ok">SVDSL aktiv</option>
      <option value="rand">Zufällig</option>
    </select>
  </label>
  <button id="go">Test starten</button>
  <p class="foot">Alle Werte sind frei erfunden. Nicht als Nachweis für Kunden verwenden.</p>
</main>
<script>

function iconSVG(anim){
  var s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ff2d8f"/><stop offset="1" stop-color="#ff9ad0"/></linearGradient></defs><rect width="200" height="200" rx="44" fill="#000"/>';
  for(var i=0;i<21;i++){
    var a=(135+i*13.5)*Math.PI/180,r2=(i%5===0)?86:78,c=Math.cos(a),n=Math.sin(a);
    s+='<line x1="'+(100+64*c).toFixed(1)+'" y1="'+(88+64*n).toFixed(1)+'" x2="'+(100+r2*c).toFixed(1)+'" y2="'+(88+r2*n).toFixed(1)+'" stroke="'+(i<=14?'url(#g)':'#3a2a42')+'" stroke-width="5" stroke-linecap="round"/>';
  }
  s+='<g'+(anim?' class="needle"':' transform="rotate(54 100 88)"')+'><path d="M96 88 L100 34 L104 88 Z" fill="#fff"/></g>';
  s+='<circle cx="100" cy="88" r="12" fill="#fff" stroke="#ff2d8f" stroke-width="4"/>';
  s+='<text x="100" y="178" text-anchor="middle" font-family="Trebuchet MS,Arial,sans-serif" font-size="25" font-weight="900" font-style="italic" fill="url(#g)">LEITUNG</text></svg>';
  return s;
}
(function(){
  var cover=document.getElementById('cover');
  document.getElementById('coverIco').innerHTML=iconSVG(true);
  function close(){cover.classList.add('hide')}
  cover.addEventListener('click',close);
  cover.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' ')close()});
  setTimeout(close,3200);
  try{
    var img=new Image();
    img.onload=function(){
      var cv=document.createElement('canvas');cv.width=cv.height=180;
      var x=cv.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,180,180);x.drawImage(img,0,0,180,180);
      document.getElementById('touch').href=cv.toDataURL('image/png');
    };
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(iconSVG(false));
  }catch(e){}
})();
(function(){
  var bar=document.getElementById('bar'),pct=document.getElementById('pct'),stat=document.getElementById('stat'),
      res=document.getElementById('res'),go=document.getElementById('go'),sc=document.getElementById('scenario');
  var steps=[[0,'Verbindung wird aufgebaut …'],[25,'Leitung wird angesprochen …'],[55,'Signalqualität wird geprüft …'],[80,'Profil wird abgeglichen …']];
  var C=553;
  function run(){
    go.disabled=true;res.className='result';res.innerHTML='';
    var dur=7000+Math.random()*3000,t0=performance.now();
    function tick(now){
      var p=Math.min((now-t0)/dur,1);
      var e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      e=0.85*e+0.15*p;
      bar.style.strokeDashoffset=C*(1-e);
      pct.textContent=Math.round(e*100)+'%';
      var label=steps[0][1];steps.forEach(function(s){if(e*100>=s[0])label=s[1]});
      stat.textContent=label;
      if(p<1){requestAnimationFrame(tick)}else{finish()}
    }
    requestAnimationFrame(tick);
  }
  function finish(){
    var v=sc.value;if(v==='rand')v=Math.random()<.5?'ok':'bad';
    if(v==='ok'){res.className='result ok';res.innerHTML='SVDSL aktiv<small>Demo-Ergebnis</small>';}
    else{res.className='result bad';res.innerHTML='SVDSL nicht aktiv<small>Demo-Ergebnis</small>';}
    stat.textContent='Test abgeschlossen (Simulation)';
    go.disabled=false;go.textContent='Erneut testen';
    bar.style.strokeDashoffset=0;pct.textContent='100%';
  }
  go.addEventListener('click',run);
})();
</script>
</body>
</html>
